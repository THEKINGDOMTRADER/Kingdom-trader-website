name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Copy the website files into www
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/
          cp *.png *.jpg www/

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Use the Kingdom Trader logo as the app icon
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick
          CONVERT=$(command -v convert || command -v magick)
          RES=android/app/src/main/res
          rm -f $RES/mipmap-anydpi-v26/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher_round.xml
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            $CONVERT icon-512.png -resize ${s}x${s} $RES/mipmap-$d/ic_launcher.png
            $CONVERT icon-512.png -resize ${s}x${s} $RES/mipmap-$d/ic_launcher_round.png
            rm -f $RES/mipmap-$d/ic_launcher_foreground.png
          done

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: kingdom-trader-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
